name: Convert Marimo to Jupyter

on:
  push:
    paths:
      - 'notebook.py'
    branches:
      - main

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install marimo

      - name: Convert notebook
        run: marimo export ipynb notebook.py -o notebook.ipynb

      - name: Commit and push converted file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add notebook.ipynb
          if ! git diff --staged --quiet; then
            git commit -m "Auto-convert notebook.py to notebook.ipynb [skip ci]"
            git push
          fi
